name: yacc test
on: push

jobs:
  yacc-test:
    runs-on: macos-13
    steps:
      - name: Test bison
        run: bison --version
      - name: Install bison
        run: brew install bison
      - name: Set PATH
        run: echo $(brew --prefix bison)/bin >> $GITHUB_PATH
      - name: Test yacc & bison
        run: |
          yacc --version
          bison --version
