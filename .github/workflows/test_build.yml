################################################################################
#
#  Github actions trigger (workflow script) for building Macaulay2
#
#    See https://help.github.com/en/actions for the documentation.
#
#  The work is split into three kinds of job:
#
#    build     compiles the interpreter and uploads the whole workspace as an
#              artifact.  One per build system and platform.
#    install   installs the distributed packages, which runs their documentation
#              examples, and checks the resulting documentation.
#    check     runs the packages' TEST blocks and the engine's unit tests.
#
#  install and check both consume the artifact from build rather than compiling
#  their own interpreter.  Neither needs anything from the other: a package's
#  tests are read from the source tree, not from the staging area, so the two
#  phases are independent given the binary.
#
################################################################################

name: Build and Test Macaulay2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - stable
      - development
  schedule:
    - cron: '0 6 * * SUN' # runs the full regression sweep every Sunday at 06:00 UTC

concurrency:
  # Cancel in-progress runs when a new workflow with the same group name is triggered
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: M2/BUILD/build

jobs:

# ------------------------------------------------------------------------------
#   Compile the interpreter, once per build system and platform
# ------------------------------------------------------------------------------

  build:
    if: github.repository == 'Macaulay2/M2' || contains(github.ref, 'global')
    name: build-${{ matrix.build-system }}-${{ matrix.os }}${{ matrix.ref && format('-{0}', matrix.ref) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A scheduled workflow always runs on the repository's default branch,
        # which is stable, so until now the Sunday build has only ever tested
        # the last release.  Give the sweep an explicit ref instead, and keep
        # stable so that it does not silently stop being built.  Every other
        # event builds the ref it was triggered on, which is what "" means to
        # actions/checkout.
        ref: ${{ github.event_name == 'schedule' && fromJSON('[ "development", "stable" ]') || fromJSON('[ "" ]') }}
        build-system:
          - autotools
          - cmake
        os:
          - ubuntu-24.04
          - macos-15
    env:
      # cmake with AppleClang is excluded upstream, so the cmake macOS cell
      # tests Homebrew Clang instead.  The compiler axis belongs in the
      # binary-only platform sweep rather than here, since installing and
      # checking packages runs the same interpreted code either way.
      COMPILER: ${{ matrix.build-system == 'cmake' && startsWith(matrix.os, 'macos') && 'brew-clang' || 'default' }}
    steps:
      # The composite action below is a local action, so it is read from the
      # workspace: check out the workflow's own ref first, then the ref under
      # test.  Otherwise a scheduled run of an older branch would look for the
      # action in a tree that predates it.
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          compiler: ${{ env.COMPILER }}

      - name: Check out the ref under test
        if: matrix.ref != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.build-system }}-${{ matrix.os }}-${{ env.COMPILER }}
          evict-old-files: job
          # Pull request runs restore but never write: a cache written under
          # refs/pull/N/merge is invisible to every other pull request anyway,
          # and fork pull requests get a read-only token.  The stable row is
          # silent so that the two scheduled rows do not fight over one key.
          save: ${{ github.event_name != 'pull_request' && matrix.ref != 'stable' }}

# ----------------------
#   Configure and build M2 using CMake
# ----------------------

      - name: Configure Macaulay2 using CMake
        if: matrix.build-system == 'cmake'
        run: |
          cmake -S../.. -B. -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_NATIVE=OFF \
            -DCMAKE_PREFIX_PATH="`brew --prefix`;`brew --prefix libffi`" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            --debug-trycompile

      - name: Build libraries using Ninja
        if: matrix.build-system == 'cmake'
        run: |
          cmake --build . --target build-libraries build-programs

      - name: Build Macaulay2 using Ninja
        if: matrix.build-system == 'cmake'
        run: |
          cmake --build . --target M2-core M2-emacs

# ----------------------
#   Configure and build M2 using Autotools
# ----------------------

      - name: Configure Macaulay2 using Autotools
        if: matrix.build-system == 'autotools'
        run: |
          ../../autogen.sh
          export F77=gfortran-14
          export FC=gfortran-14
          ../../configure --with-system-gc --with-fplll

      - name: Build libraries using Make
        if: matrix.build-system == 'autotools'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu) -C libraries

      - name: Build Macaulay2 using Make
        if: matrix.build-system == 'autotools'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu) PACKAGES=

# ----------------------
#   Hand the tree to the install and check jobs
# ----------------------

      # The source tree travels with the build tree, so that the consumers do
      # not check out sources with fresh timestamps and send make or ninja off
      # to recompile everything they were handed.  .git is dropped: consumers
      # take theirs from their own checkout.
      - name: Pack the build tree
        run: |
          tar -cf - -C "$GITHUB_WORKSPACE" --exclude=.git . |
            zstd -T0 -o "$RUNNER_TEMP/build-tree.tar.zst"
          ls -l "$RUNNER_TEMP/build-tree.tar.zst"

      - name: Upload the build tree
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-${{ matrix.build-system }}-${{ matrix.os }}${{ matrix.ref && format('-{0}', matrix.ref) || '' }}
          path: ${{ runner.temp }}/build-tree.tar.zst
          compression-level: 0 # already compressed
          retention-days: 1

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.build-system }}-${{ matrix.os }}${{ matrix.ref && format('-{0}', matrix.ref) || '' }}-logs
          # Comments cannot go inside the block scalar below: it is literal, so
          # they would be passed to the action as path patterns.
          #
          #   Autotools: config.log, include/*, libraries/*/build/*/config.log
          #   CMake:     CMakeCache.txt, CMakeFiles/*
          path: |
            M2/BUILD/build/config.log
            M2/BUILD/build/check-configure/tmp/config.log
            M2/BUILD/build/include/*
            M2/BUILD/build/libraries/*/build/*/config.log
            M2/BUILD/build/CMakeCache.txt
            M2/BUILD/build/CMakeFiles/CMakeError.log
            M2/BUILD/build/CMakeFiles/CMakeOutput.log
            M2/BUILD/build/CMakeFiles/CMakeConfigureLog.yaml
            M2/BUILD/build/libraries/*/build/config.log

# ------------------------------------------------------------------------------
#   Install the distributed packages, which runs their documentation examples
# ------------------------------------------------------------------------------

  # needs: is per-job, not per-matrix-cell, so every install job waits for every
  # build job — including the slow macOS ones.  That costs a few minutes of wall
  # time and there is no way to express the finer dependency; the alternative,
  # four self-sufficient jobs, costs three redundant compiles instead.
  install:
    needs: build
    name: install-${{ matrix.build-system }}-${{ matrix.os }}${{ matrix.ref && format('-{0}', matrix.ref) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'schedule' && fromJSON('[ "development", "stable" ]') || fromJSON('[ "" ]') }}
        build-system:
          - autotools
          - cmake
        os:
          - ubuntu-24.04
          - macos-15
    env:
      COMPILER: ${{ matrix.build-system == 'cmake' && startsWith(matrix.os, 'macos') && 'brew-clang' || 'default' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          compiler: ${{ env.COMPILER }}

      - uses: actions/download-artifact@v8
        with:
          name: build-tree-${{ matrix.build-system }}-${{ matrix.os }}${{ matrix.ref && format('-{0}', matrix.ref) || '' }}
          path: ${{ runner.temp }}

      # This restores the build job's copy of the sources over the checkout
      # above, timestamps included, so that make and ninja both see a tree they
      # have nothing left to do in.
      - name: Unpack the build tree
        run: |
          zstd -dc "$RUNNER_TEMP/build-tree.tar.zst" | tar -xf - -C "$GITHUB_WORKSPACE"

      - name: Install packages using Ninja
        if: matrix.build-system == 'cmake'
        run: |
          cmake --build . --target install-packages
          if [[ "${{ runner.os }}" == "Linux" ]]; then
              sudo apt-get install -y -q --no-install-recommends dpkg-dev
              echo "GIT_COMMIT=`git describe --dirty --always --match HEAD`" >> $GITHUB_ENV
              cpack -G DEB
          fi

      - name: Install packages using Make
        if: matrix.build-system == 'autotools'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

# ----------------------
#   Tests that need the distribution installed, and so cannot go in the check
#   job.  Macaulay2/tests/normal is loaded as Core's own test suite -- it is
#   what M2 --check 2 runs -- and release-checklist.m2 there loads every
#   distributed package's documentation.  With the packages staged that is a
#   cheap lookup in a gdbm database; without them it has to load each package
#   in process, which runs the runner out of memory.  (The Makefile already
#   hints at the cost: release-checklist.out carries its own TLIMIT = 180,
#   "often takes longer than 90s in GitHub builds".)
#
#   The per-package checks in the check job are a different matter: check-$i
#   has no prerequisites and reads its tests from the source tree.
# ----------------------

      - name: Run the Core test suite using Autotools
        if: matrix.build-system == 'autotools' && runner.os == 'Linux'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu) -C Macaulay2/tests check

      - name: Run the Core test suite using CTest
        if: matrix.build-system == 'cmake' && runner.os == 'macOS'
        run: |
          set -xe
          ./M2 -q --check 2
          cmake --build . --target M2-tests
          ctest -j4 --output-on-failure -R "ComputationsBook"
          # TODO: add Macaulay2/tests/engine when https://github.com/Macaulay2/M2/issues/1213 is fixed

      # Redundant when the documentation is built as html, since then "all"
      # already ran the link checker; kept for the configurations where it is
      # not in SUBDIRS.
      - name: Check documentation links
        if: matrix.build-system == 'autotools' && runner.os == 'Linux'
        run: |
          make -C Macaulay2/html-check-links check

      - name: Validate HTML documentation
        if: matrix.build-system == 'autotools' && runner.os == 'Linux'
        run: |
          pipx install html5validator
          if test ${{ github.event_name }} = pull_request
          then
            git fetch --depth=1 origin development
            # validate everything if any changes to Core
            if test "$(git diff --stat origin/development HEAD -- ../../Macaulay2/m2)"
            then
              make validate-html
            else
            # otherwise, just validate HTML docs for packages that have been updated
              PACKAGES=$(git diff --stat origin/development HEAD -- ../../Macaulay2/packages/ | grep -Po "(?<=Macaulay2/packages/)[^/\.]*(?=\.m2|/)" | uniq | sed 's/undistributed-packages//g' | xargs)
              make validate-html PACKAGES="$PACKAGES"
            fi
          else
            # if not a pull request (scheduled or pre-master builds), then validate everything
            make validate-html
          fi

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.build-system }}-${{ matrix.os }}${{ matrix.ref && format('-{0}', matrix.ref) || '' }}-logs
          # See the note on the build job's log upload: no comments inside the
          # block scalar.  These are the errors installPackage leaves behind
          # when a documentation example fails.
          path: |
            M2/BUILD/build/usr-dist/common/share/doc/Macaulay2/*/example-output/*.errors

      - name: Upload Macaulay2 package for Ubuntu (x86_64)
        if: matrix.build-system == 'cmake' && runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v7
        with:
          name: Macaulay2-${{ env.GIT_COMMIT }}-ubuntu-x86_64
          path: |
            M2/BUILD/build/Macaulay2-*
          retention-days: 1

# ------------------------------------------------------------------------------
#   Run the tests, which need the interpreter and Core but no installed packages
# ------------------------------------------------------------------------------

  check:
    needs: build
    name: check-${{ matrix.build-system }}-${{ matrix.os }}${{ matrix.ref && format('-{0}', matrix.ref) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'schedule' && fromJSON('[ "development", "stable" ]') || fromJSON('[ "" ]') }}
        build-system:
          - autotools
          - cmake
        os:
          - ubuntu-24.04
          - macos-15
        exclude:
          # These two combinations run no test step today.  Adding package
          # checks on autotools/macOS is a separate piece of work; the cmake
          # side has a check-packages target that no workflow has ever invoked.
          - build-system: autotools
            os: macos-15
          - build-system: cmake
            os: ubuntu-24.04
    env:
      COMPILER: ${{ matrix.build-system == 'cmake' && startsWith(matrix.os, 'macos') && 'brew-clang' || 'default' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          compiler: ${{ env.COMPILER }}

      - uses: actions/download-artifact@v8
        with:
          name: build-tree-${{ matrix.build-system }}-${{ matrix.os }}${{ matrix.ref && format('-{0}', matrix.ref) || '' }}
          path: ${{ runner.temp }}

      - name: Unpack the build tree
        run: |
          zstd -dc "$RUNNER_TEMP/build-tree.tar.zst" | tar -xf - -C "$GITHUB_WORKSPACE"

      # --check 1 is runBasicTests(), and --check 3 is checkAllPackages(), which
      # runs check(pkg) for each distributed package -- the same thing the
      # autotools check target does, so it needs no installed packages either.
      # --check 2 is check("Core"), which does; it is in the install job.
      - name: Run Tests using CTest
        if: matrix.build-system == 'cmake'
        run: |
          set -xe
          ./M2 -q --check 1
          ./M2 -q --check 3
          cmake --build . --target M2-unit-tests
          cmake --build . --target memtailor-unit-tests mathic-unit-tests mathicgb-unit-tests
          ctest -j1 --output-on-failure -R "unit-tests"

      # -j2 rather than -j$(nproc): each M2 check already uses about 1.3 cores,
      # so four of them on a four-core runner oversubscribe.  --output-sync is
      # not optional, since the check failure log works by echoing the failing
      # input line and that is unreadable when several packages interleave.
      # Use target, not recurse: with recurse the whole sub-make's output is
      # held until it exits, which here would mean half an hour of silence.
      #
      # Recurse into packages directly rather than running the top level check
      # target: that one also visits Macaulay2/tests, which needs the
      # distribution installed, and -o does not propagate to a sub-make so
      # there is no way to skip it from the top.  The other subdirectories'
      # check targets are no-ops or trivial.
      - name: Run Tests using Autotools
        if: matrix.build-system == 'autotools'
        run: |
          make -j2 --output-sync=target -C Macaulay2/packages check

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-${{ matrix.build-system }}-${{ matrix.os }}${{ matrix.ref && format('-{0}', matrix.ref) || '' }}-logs
          # See the note on the build job's log upload: no comments inside the
          # block scalar.  The /tmp entries are the files a failing package
          # test leaves behind; the last line is Macaulay2/tests.
          path: |
            /tmp/M2-*/*.tmp
            /tmp/M2-*/*.m2
            M2/BUILD/build/Macaulay2/tests/*/*.errors
