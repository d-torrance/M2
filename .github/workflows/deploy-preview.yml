################################################################################
#
#  Builds Macaulay2 from source and deploys the resulting documentation to the
#  gh-pages branch so it can be previewed via GitHub Pages.
#
#  Trigger via Actions → "Deploy documentation preview" → Run workflow.
#
#  After the first run, enable GitHub Pages in Settings → Pages and point it
#  at the gh-pages branch (root folder).  The preview will then be available
#  at https://<org>.github.io/<repo>/
#
#  This workflow is temporary and should be removed before merging the PR.
#
################################################################################

name: Deploy documentation preview

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: M2/BUILD/build

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

# ----------------------------------------
#   Install build dependencies
# ----------------------------------------

      - name: Install build dependencies
        working-directory: .
        run: |
          sudo add-apt-repository -y -n ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y -q --no-install-recommends \
            gfortran-14 libtool-bin yasm ccache ninja-build \
            liblzma-dev libboost-stacktrace-dev \
            libncurses-dev libncurses5-dev libreadline-dev \
            libeigen3-dev libopenblas-dev libxml2-dev \
            libgc-dev libgdbm-dev libglpk-dev libgmp3-dev \
            libgtest-dev libmpfr-dev libmpfi-dev libntl-dev gfan \
            libgivaro-dev libboost-regex-dev fflas-ffpack libflint-dev \
            libmps-dev libfrobby-dev libsingular-dev singular-data \
            libcdd-dev cohomcalg topcom 4ti2 libnormaliz-dev normaliz \
            coinor-csdp libnauty-dev nauty lrslib polymake pipx phcpack \
            w3c-markup-validator libtbb-dev qepcad libomp-16-dev \
            msolve libfplll-dev libjansson-dev r-base

# ----------------------------------------
#   Configure and build M2
# ----------------------------------------

      - name: Configure
        working-directory: .
        run: |
          mkdir -p M2/BUILD/build
          cd M2/BUILD/build
          ../../autogen.sh
          export F77=gfortran-14
          export FC=gfortran-14
          ../../configure --with-system-gc --with-fplll

      - name: Build libraries
        run: make -j$(nproc) -C libraries

      - name: Build M2
        run: make -j$(nproc) PACKAGES=

      - name: Install packages
        run: make -j$(nproc)

# ----------------------------------------
#   Deploy share/ to gh-pages
# ----------------------------------------

      - name: Deploy to gh-pages
        working-directory: .
        run: |
          SHARE=M2/BUILD/build/usr-dist/common/share

          # Suppress Jekyll so paths like _rank.html are served as-is
          touch "$SHARE/.nojekyll"

          # Root redirect to the Macaulay2Doc index
          cat > "$SHARE/index.html" << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=doc/Macaulay2/Macaulay2Doc/html/index.html">
            <title>Macaulay2 Documentation Preview</title>
          </head>
          <body>
            <a href="doc/Macaulay2/Macaulay2Doc/html/index.html">Macaulay2 Documentation</a>
          </body>
          </html>
          EOF

          cd "$SHARE"
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Documentation preview (built from ${{ github.sha }})"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
