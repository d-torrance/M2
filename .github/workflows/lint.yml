name: Lint

# push is deliberately absent: every push to a branch with an open pull request
# would otherwise trigger this workflow twice.
on: [ pull_request ]

permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y codespell
      - name: Run codespell
        shell: bash -l {0}
        run: codespell --ignore-words=.codespell_ignore M2/Macaulay2/packages
