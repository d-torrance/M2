# Path-based labels applied by .github/workflows/labeler.yml.
#
# Only topical labels belong here — ones that say what part of Macaulay2 a pull
# request touches, and that can be decided from the paths alone.  Labels that
# record a decision (under discussion, waiting for review, contributions
# welcome, ...) stay in human hands, and nothing here removes a label somebody
# applied deliberately: sync-labels is off.
#
# The label names must match the repository's existing labels exactly, and the
# comments give the description each one carries there.

# Macaulay2/e
Engine:
  - changed-files:
      - any-glob-to-any-file:
          - 'M2/Macaulay2/e/**'

Interpreter:
  - changed-files:
      - any-glob-to-any-file:
          - 'M2/Macaulay2/c/**'
          - 'M2/Macaulay2/d/**'
          - 'M2/Macaulay2/bin/**'

# Macaulay2/system
threads:
  - changed-files:
      - any-glob-to-any-file:
          - 'M2/Macaulay2/system/**'

# Issues involving the Core scripts.
Core:
  - changed-files:
      - any-glob-to-any-file:
          - 'M2/Macaulay2/m2/**'
          - 'M2/Macaulay2/packages/Macaulay2Doc/**'
          - 'M2/Macaulay2/packages/Macaulay2Doc.m2'

Documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'M2/Macaulay2/packages/Macaulay2Doc/**'
          - 'M2/Macaulay2/packages/Macaulay2Doc.m2'
          - 'M2/Macaulay2/man/**'
          - '**/*.md'

editors:
  - changed-files:
      - any-glob-to-any-file:
          - 'M2/Macaulay2/editors/**'

# GitHub workflows, etc.
Infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'M2/BUILD/**'
          - 'M2/cmake/**'
          - 'M2/m4/**'
          - 'M2/configure.ac'
          - 'M2/autogen.sh'
          - '**/Makefile*.in'
          - '**/CMakeLists.txt'

# Pull requests that update a dependency file
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'M2/libraries/**'
          - 'M2/submodules/**'
          - '.gitmodules'

# Pull requests that update Javascript code
javascript:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.js'
