################################################################################
#
#  Composite action for setting up a Macaulay2 build environment.
#
#  Shared by every job in test_build.yml: the "build" producer, which compiles
#  the interpreter, and the "install" and "check" consumers, which only run it.
#  The consumers still need the whole dependency list, since the interpreter
#  links against it and the interface packages shell out to the programs in it.
#
################################################################################

name: Set up build environment
description: Install Macaulay2's dependencies and select the compiler

inputs:
  compiler:
    description: Either "default" or "brew-clang"
    required: false
    default: default

runs:
  using: composite
  steps:

# ----------------------
#   Install missing tools and libraries for macOS
# ----------------------

    - name: Install requirements for macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew config
        brew update
        brew trust macaulay2/tap
        brew tap macaulay2/tap
        brew install automake bison boost libtool tbb ccache ctags llvm make yasm libffi msolve googletest fplll eigen jansson r palp zstd
        brew install texinfo || true # sometimes post-install step fails
        brew install --only-dependencies macaulay2/tap/M2
        brew link factory --force

# ----------------------
#   Install missing tools and libraries for Linux
# ----------------------

    - name: Install requirements for Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo add-apt-repository -y -n ppa:macaulay2/macaulay2
        sudo apt-get update
        sudo apt-get install -y -q --no-install-recommends clang-16 gfortran libtool-bin ninja-build yasm ccache
        sudo apt-get install -y -q --no-install-recommends liblzma-dev libboost-stacktrace-dev \
                libncurses-dev libncurses5-dev libreadline-dev libeigen3-dev libopenblas-dev libxml2-dev \
                libgc-dev libgdbm-dev libglpk-dev libgmp3-dev libgtest-dev libmpfr-dev libmpfi-dev libntl-dev gfan \
                libgivaro-dev libboost-regex-dev fflas-ffpack libflint-dev libmps-dev libfrobby-dev \
                libsingular-dev singular-data libcdd-dev cohomcalg topcom 4ti2 libnormaliz-dev normaliz coinor-csdp \
                libnauty-dev nauty lrslib polymake pipx phcpack w3c-markup-validator libtbb-dev qepcad libomp-16-dev \
                msolve libfplll-dev libjansson-dev r-base palp

# ----------------------
#   Steps common to all build variants
# ----------------------

    - name: Set up compiler
      shell: bash
      run: |
        case "${{ inputs.compiler }}" in
          default)
            echo "Using default compiler"
            ;;
          brew-clang)
            echo "Using Homebrew Clang"
            echo "CC=clang"    >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
            echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
            # https://github.com/Macaulay2/M2/issues/3967
            # maybe remove after some future llvm release?
            SDKROOT=$(xcrun --show-sdk-path)
            echo "CXXFLAGS=-nostdinc++ -isystem $SDKROOT/usr/include/c++/v1 -isystem $SDKROOT/usr/include" >> $GITHUB_ENV
            ;;
        esac

    # This runs after "Set up compiler" so that the distribution's own ccache
    # symlink directory lands ahead of $(brew --prefix llvm)/bin on the PATH.
    - name: Prepare build environment
      shell: bash
      run: |
        if [[ "${{ runner.os }}" == "Linux" ]]
        then echo "/usr/lib/ccache"                     >> $GITHUB_PATH
             echo "/home/linuxbrew/.linuxbrew/bin"      >> $GITHUB_PATH
        else echo `brew --prefix ccache`/libexec        >> $GITHUB_PATH
             echo `brew --prefix make  `/libexec/gnubin >> $GITHUB_PATH
             echo `brew --prefix libtool`/libexec/gnubin >> $GITHUB_PATH
             echo `brew --prefix bison`/bin             >> $GITHUB_PATH
             echo "CPPFLAGS=-I$(brew --prefix)/include -I$(brew --prefix libomp)/include -I$(brew --prefix readline)/include" >> $GITHUB_ENV
             echo "LDFLAGS= -L$(brew --prefix)/lib     -L$(brew --prefix libomp)/lib     -L$(brew --prefix readline)/lib"     >> $GITHUB_ENV
        fi
